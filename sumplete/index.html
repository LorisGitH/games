<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sumplete">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sumplete</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-edge: #e3ded2;
    --text: #23262d;
    --muted: #8a8678;
    --locked: #3b6fd8;
    --locked-text: #ffffff;
    --ok: #2f9e5b;
    --ok-bg: #dff3e6;
    --heart: #e04a5a;
    --overlay: rgba(244, 241, 234, .88);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #252932;
      --surface-edge: #343946;
      --text: #eceae4;
      --muted: #8b8f9c;
      --locked: #5a8cf0;
      --locked-text: #0f1218;
      --ok: #4cc27c;
      --ok-bg: #1d3a2a;
      --heart: #ef6b78;
      --overlay: rgba(22, 24, 29, .88);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { position: fixed; inset: 0; width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    height: 100dvh;
    touch-action: none;
    overscroll-behavior: none;
  }

  main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  #timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 17px; }

  #stats { display: flex; align-items: center; justify-content: space-between; margin-top: -4px; }
  #lives { display: flex; gap: 6px; font-size: 24px; line-height: 1; color: var(--heart); }
  #lives .lost { color: var(--surface-edge); }
  #lives .hit { animation: beat .5s; }
  @keyframes beat { 30% { transform: scale(1.5); } }
  #easy {
    display: flex; align-items: center; gap: 8px; padding: 4px 2px;
    border: 0; background: none; font: inherit; font-size: 14px; color: var(--muted);
  }
  #easy .sw {
    position: relative; width: 40px; height: 24px; border-radius: 12px;
    background: var(--surface-edge); transition: background .2s;
  }
  #easy .sw i {
    position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .2s;
  }
  #easy[aria-checked="true"] { color: var(--text); }
  #easy[aria-checked="true"] .sw { background: var(--locked); }
  #easy[aria-checked="true"] .sw i { transform: translateX(16px); }
  #completed { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }


  #grid {
    --gap: 5px;
    display: grid;
    grid-template-columns: repeat(calc(var(--n) + 1), 1fr);
    gap: var(--gap);
    width: min(100%, calc(76px * (var(--n) + 1)));
    margin: 4px auto 0;
  }
  #grid > div {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    border-radius: 12px;
  }

  .cell {
    position: relative; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--surface-edge);
    font-size: clamp(18px, 6.2vw, 30px); font-weight: 650;
    cursor: pointer;
    transition: transform .08s, opacity .15s, background .15s;
  }
  .cell:active { transform: scale(.94); }
  .cell.removed { background: transparent; border-style: dashed; color: var(--muted); opacity: .38; }
  .cell.removed span { text-decoration: line-through; text-decoration-thickness: 2px; }
  .cell.locked { background: var(--locked); border-color: var(--locked); color: var(--locked-text); }
  .cell.locked::before {
    content: ""; position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7;
  }
  .cell.pressing::after {
    content: ""; position: absolute; inset: 0;
    background: var(--locked); opacity: .35;
    transform-origin: bottom; animation: fill var(--long, 420ms) linear forwards;
  }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .target {
    font-size: clamp(14px, 4.6vw, 20px); font-weight: 700; color: var(--muted);
    transition: color .15s, background .15s;
  }
  .target.adj { color: var(--locked); }
  .target.ok { color: var(--ok); background: var(--ok-bg); }

  #hint { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; margin: 2px 0 0; }
  #hint b { color: var(--text); font-weight: 600; }

  #actions { display: flex; gap: 8px; margin-top: auto; }
  #actions button {
    flex: 1; padding: 14px 0; font: inherit; font-weight: 600; font-size: 15px;
    border: 1px solid var(--surface-edge); border-radius: 12px;
    background: var(--surface); color: var(--text);
  }
  #actions button:active { transform: scale(.97); }
  #actions button:disabled { opacity: .4; }
  .cell.wrong { animation: shake .4s; border-color: var(--heart); }
  @keyframes shake {
    20% { transform: translateX(-5px); background: var(--heart); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 40px; margin: 0; letter-spacing: -.03em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 17px; }
  .overlay > button {
    margin-top: 18px; padding: 14px 32px; font: inherit; font-weight: 600; font-size: 16px;
    border: 0; border-radius: 12px; background: var(--text); color: var(--bg);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sumplete</h1>
    <span id="timer">0:00</span>
  </header>

  <div id="stats">
    <span id="lives" aria-label="Vies"></span>
    <button id="easy" role="switch" aria-checked="false">
      <span class="sw"><i></i></span><span>Plus simple</span>
    </button>
    <span id="completed"></span>
  </div>

  <div id="grid"></div>

  <p id="hint"><b>Toucher</b> : supprimer un chiffre &nbsp;·&nbsp; <b>Appui long</b> : le valider</p>

  <div id="actions">
    <button id="undo">Annuler</button>
  </div>
</main>

<div id="win" class="overlay">
  <h2>Bravo !</h2>
  <p id="win-time"></p>
  <p id="win-count"></p>
  <button id="win-next">Grille suivante</button>
</div>

<div id="over" class="overlay">
  <h2>Plus de vies</h2>
  <p>On reprend la même grille.</p>
  <button id="retry">Réessayer</button>
</div>

<script>
(() => {
  'use strict';

  const LONG_MS = 420;
  const MOVE_TOLERANCE = 10;
  const STORE = 'sumplete:v1';
  const NORMAL = 0, REMOVED = 1, LOCKED = 2;
  const STATE_CLASS = ['', 'removed', 'locked'];

  const $ = s => document.querySelector(s);
  const gridEl = $('#grid');
  const timerEl = $('#timer');
  const undoBtn = $('#undo');
  const livesEl = $('#lives');
  const completedEl = $('#completed');
  const easyBtn = $('#easy');
  const MAX_LIVES = 3;
  const MIN_SIZE = 5, MAX_SIZE = 8;

  let G;               // current game
  let els;             // DOM refs of the current grid
  let store = load();  // { n, completed, best: {n: ms}, game }
  let lastTick = 0;

  /* ---------- storage ---------- */

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
  }
  function save() {
    try {
      store.game = G && !G.won ? {
        n: G.n, vals: G.vals, keep: G.keep, rowT: G.rowT, colT: G.colT,
        cells: G.cells, history: G.history, elapsed: G.elapsed, lives: G.lives,
      } : null;
      localStorage.setItem(STORE, JSON.stringify(store));
    } catch { /* storage unavailable: play without persistence */ }
  }

  /* ---------- puzzle generation ---------- */

  const rnd = k => Math.floor(Math.random() * k);
  const randomSize = () => MIN_SIZE + rnd(MAX_SIZE - MIN_SIZE + 1);

  // Counts solutions (stops at `limit`) by choosing, for each row, a subset of
  // cells that matches its target and fits within what the columns still need.
  function countSolutions(vals, rowT, colT, limit) {
    const n = vals.length;
    const cand = [];
    for (let r = 0; r < n; r++) {
      const list = [];
      for (let m = 1; m < (1 << n); m++) {
        let s = 0;
        for (let c = 0; c < n; c++) if (m >> c & 1) s += vals[r][c];
        if (s === rowT[r]) list.push(m);
      }
      cand.push(list);
    }
    const suffix = Array.from({ length: n + 1 }, () => new Array(n).fill(0));
    for (let r = n - 1; r >= 0; r--)
      for (let c = 0; c < n; c++) suffix[r][c] = suffix[r + 1][c] + vals[r][c];

    const rem = colT.slice();
    let count = 0;
    (function dfs(r) {
      if (count >= limit) return;
      if (r === n) { if (rem.every(x => x === 0)) count++; return; }
      for (const m of cand[r]) {
        let ok = true;
        for (let c = 0; c < n; c++) if ((m >> c & 1) && rem[c] < vals[r][c]) { ok = false; break; }
        if (!ok) continue;
        for (let c = 0; c < n; c++) if (m >> c & 1) rem[c] -= vals[r][c];
        for (let c = 0; c < n && ok; c++) if (rem[c] > suffix[r + 1][c]) ok = false;
        if (ok) dfs(r + 1);
        for (let c = 0; c < n; c++) if (m >> c & 1) rem[c] += vals[r][c];
      }
    })(0);
    return count;
  }

  function randomPuzzle(n) {
    const vals = Array.from({ length: n }, () => Array.from({ length: n }, () => 1 + rnd(9)));
    let keep;
    do {
      keep = Array.from({ length: n }, () => Array.from({ length: n }, () => Math.random() < 0.55));
    } while (
      !keep.every(row => row.some(Boolean)) ||
      !Array.from({ length: n }, (_, c) => keep.some(row => row[c])).every(Boolean)
    );
    const rowT = vals.map((row, r) => row.reduce((s, v, c) => s + (keep[r][c] ? v : 0), 0));
    const colT = Array.from({ length: n }, (_, c) =>
      vals.reduce((s, row, r) => s + (keep[r][c] ? row[c] : 0), 0));
    return { n, vals, keep: keep.flat(), rowT, colT };
  }

  // Only grids with a single solution, so a wrong move can be told from a right one.
  function generate(n) {
    for (;;) {
      const p = randomPuzzle(n);
      if (countSolutions(p.vals, p.rowT, p.colT, 2) === 1) return p;
    }
  }

  /* ---------- game state ---------- */

  function newGame(n) {
    const p = generate(n);
    G = { ...p, cells: new Array(n * n).fill(NORMAL), history: [], elapsed: 0, lives: MAX_LIVES, won: false };
    start();
  }

  function restore(g) {
    G = { ...g, won: false };
    start();
  }

  function start() {
    build();
    update();
    $('#win').classList.remove('show');
    $('#over').classList.toggle('show', G.lives <= 0);
    save();
  }

  const playing = () => !G.won && G.lives > 0;

  function setCell(i, state) {
    if (G.cells[i] === state) return;
    G.history.push([i, G.cells[i]]);
    G.cells[i] = state;
    update();
    save();
  }

  // A removal is wrong if the cell belongs to the solution; a validation is wrong if it doesn't.
  function wrongMove(i) {
    navigator.vibrate?.([40, 30, 40]);
    G.lives--;
    update();
    els.cells[i].classList.add('wrong');
    livesEl.children[G.lives]?.classList.add('hit');
    if (G.lives <= 0) setTimeout(() => $('#over').classList.add('show'), 450);
    save();
  }

  function tap(i) {
    if (!playing()) return;
    const s = G.cells[i];
    if (s === LOCKED) return;
    if (s === NORMAL && G.keep[i]) return wrongMove(i);
    setCell(i, s === REMOVED ? NORMAL : REMOVED);
  }

  function longPress(i) {
    if (!playing()) return;
    if (G.cells[i] !== LOCKED && !G.keep[i]) return wrongMove(i);
    setCell(i, G.cells[i] === LOCKED ? NORMAL : LOCKED);
  }

  function undo() {
    if (!playing() || !G.history.length) return;
    const [i, prev] = G.history.pop();
    G.cells[i] = prev;
    update();
    save();
  }

  // same grid, fresh start
  function retry() {
    G.cells.fill(NORMAL);
    G.history = [];
    G.elapsed = 0;
    G.lives = MAX_LIVES;
    start();
  }

  /* ---------- rendering ---------- */

  function build() {
    const { n } = G;
    gridEl.style.setProperty('--n', n);
    gridEl.replaceChildren();
    els = { cells: [], rowT: [], colT: [] };

    gridEl.append(document.createElement('div')); // top-left corner
    for (let c = 0; c < n; c++) {
      const d = document.createElement('div');
      d.className = 'target';
      d.textContent = G.colT[c];
      els.colT.push(d);
      gridEl.append(d);
    }
    for (let r = 0; r < n; r++) {
      const t = document.createElement('div');
      t.className = 'target';
      t.textContent = G.rowT[r];
      els.rowT.push(t);
      gridEl.append(t);
      for (let c = 0; c < n; c++) {
        const d = document.createElement('div');
        d.className = 'cell';
        d.dataset.i = r * n + c;
        d.innerHTML = '<span></span>';
        d.firstChild.textContent = G.vals[r][c];
        els.cells.push(d);
        gridEl.append(d);
      }
    }
  }

  function update() {
    const { n } = G;
    const rs = new Array(n).fill(0), cs = new Array(n).fill(0);
    const rOpen = new Array(n).fill(0), cOpen = new Array(n).fill(0); // cells not yet removed or validated
    const rLock = new Array(n).fill(0), cLock = new Array(n).fill(0); // sum of validated cells
    for (let i = 0; i < n * n; i++) {
      const r = (i / n) | 0, c = i % n, st = G.cells[i];
      els.cells[i].className = 'cell ' + STATE_CLASS[st];
      if (st !== REMOVED) { rs[r] += G.vals[r][c]; cs[c] += G.vals[r][c]; }
      if (st === NORMAL) { rOpen[r]++; cOpen[c]++; }
      if (st === LOCKED) { rLock[r] += G.vals[r][c]; cLock[c] += G.vals[r][c]; }
    }
    // a line only turns green once every one of its cells is decided and the sum is right
    // "plus simple": validated cells are subtracted from the displayed target
    const easy = !!store.easy;
    const mark = (el, sum, target, open, locked) => {
      el.textContent = easy ? target - locked : target;
      el.className = 'target' + (open === 0 && sum === target ? ' ok' : easy && locked ? ' adj' : '');
    };
    for (let k = 0; k < n; k++) {
      mark(els.rowT[k], rs[k], G.rowT[k], rOpen[k], rLock[k]);
      mark(els.colT[k], cs[k], G.colT[k], cOpen[k], cLock[k]);
    }
    easyBtn.setAttribute('aria-checked', String(easy));

    undoBtn.disabled = !playing() || !G.history.length;
    renderTimer();
    renderStats();

    const solved = rs.every((s, k) => s === G.rowT[k]) && cs.every((s, k) => s === G.colT[k]);
    if (solved && !G.won) win();
  }

  function renderStats() {
    livesEl.replaceChildren(...Array.from({ length: MAX_LIVES }, (_, k) => {
      const h = document.createElement('span');
      h.textContent = '♥';
      if (k >= G.lives) h.className = 'lost';
      return h;
    }));
    const done = store.completed || 0;
    completedEl.textContent = done + (done > 1 ? ' grilles réussies' : ' grille réussie');
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function renderTimer() { timerEl.textContent = fmt(G.elapsed); }

  function win() {
    G.won = true;
    store.completed = (store.completed || 0) + 1;
    renderStats();
    store.best = store.best || {};
    const prev = store.best[G.n];
    const record = !prev || G.elapsed < prev;
    if (record) store.best[G.n] = G.elapsed;
    $('#win-time').textContent = 'Résolu en ' + fmt(G.elapsed) +
      (record ? ' · nouveau record !' : ' · record ' + fmt(prev));
    $('#win-count').textContent = store.completed + (store.completed > 1 ? ' grilles réussies' : ' grille réussie');
    $('#win').classList.add('show');
    navigator.vibrate?.([20, 40, 20]);
    save();
  }

  /* ---------- input: tap = remove, long press = validate ---------- */

  let press = null;

  function endPress() {
    if (!press) return;
    clearTimeout(press.timer);
    press.el.classList.remove('pressing');
    press = null;
  }

  gridEl.addEventListener('pointerdown', e => {
    const el = e.target.closest('.cell');
    if (!el || !playing() || press) return;
    const i = +el.dataset.i;
    press = { el, i, x: e.clientX, y: e.clientY, long: false, moved: false };
    el.style.setProperty('--long', LONG_MS + 'ms');
    if (G.cells[i] !== REMOVED) el.classList.add('pressing');
    press.timer = setTimeout(() => {
      press.long = true;
      el.classList.remove('pressing');
      navigator.vibrate?.(15);
      longPress(i);
    }, LONG_MS);
  });

  gridEl.addEventListener('pointermove', e => {
    if (!press || press.moved) return;
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > MOVE_TOLERANCE) {
      press.moved = true;
      clearTimeout(press.timer);
      press.el.classList.remove('pressing');
    }
  });

  const release = e => {
    if (!press) return;
    if (e.type === 'pointerup' && !press.long && !press.moved) tap(press.i);
    endPress();
  };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  gridEl.addEventListener('contextmenu', e => e.preventDefault());

  // no page scrolling or rubber-band bounce (iOS Safari ignores overscroll-behavior)
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- controls ---------- */

  undoBtn.addEventListener('click', undo);
  easyBtn.addEventListener('click', () => { store.easy = !store.easy; update(); save(); });
  $('#retry').addEventListener('click', retry);
  $('#win-next').addEventListener('click', () => newGame(randomSize()));

  // timer runs once the player has made a move, and only while the page is visible
  setInterval(() => {
    const now = performance.now();
    if (G && playing() && (G.history.length || G.lives < MAX_LIVES) && !document.hidden) {
      G.elapsed += now - lastTick;
      renderTimer();
    }
    lastTick = now;
  }, 250);
  document.addEventListener('visibilitychange', () => { if (G && !document.hidden) lastTick = performance.now(); save(); });

  /* ---------- boot ---------- */

  lastTick = performance.now();
  const g = store.game;
  if (g && g.vals && g.keep && g.cells && g.cells.length === g.n * g.n) restore(g);
  else newGame(randomSize());
})();
</script>
</body>
</html>
